spring.application.name=order-duality
spring.main.banner-mode=off
spring.threads.virtual.enabled=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

orders.database.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/order_demo?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
orders.database.user=${DB_USER:order_api}
orders.database.password=${DB_PASSWORD:local-api-only}
orders.database.pool-size=${DB_POOL_SIZE:10}
orders.database.agent-user=${AGENT_DB_USER:order_agent}
orders.database.agent-password=${AGENT_DB_PASSWORD:local-agent-only}
orders.database.agent-pool-size=${AGENT_DB_POOL_SIZE:2}
orders.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
orders.ollama.model=${OLLAMA_MODEL:llama3.1:8b}
orders.ollama.timeout=${OLLAMA_TIMEOUT_SECONDS:120}s

# Comparison read paths (Hibernate and Spring Data JDBC). The schema comes from sql/, never from Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Read DATETIME as LocalDateTime directly, like the plain-JDBC path does. Otherwise Hibernate goes through
# java.sql.Timestamp and shifts the values by the JVM's time zone.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
